<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
        <title>Select answer</title>
        <style>
            body{
                font-family: "Lato", sans-serif;
                font-weight: 300;
                font-size: 20px;
            }
            h1{
                font-weight: 500;
                font-size: 32px;
            }
            .namelabel{
                font-size: 20px;
                padding-left: 4px;
                width: fit-content;
                height: 10px;
                padding-top: 0px;
                margin-top: 0px;
            }
            .addform{
                width: min-content;
                overflow: hidden;
            }
            .container{
                background-color: gainsboro;
                width: max-content;
                border-radius: 10px;
                margin-top: 5px;
                padding: 5px;
                overflow: hidden;
            }
            input[type="submit"]{
                border-radius: 10px;
                border-width: 0px;
                padding: 5px;
                margin-top: 5px;
                float: right;
            }
            .padded{
                margin-bottom: 0px;
            }
            button{
                border-radius: 10px;
                border-width: 0px;
                padding: 5px;
            }
            .right{
                float: right;
            }
            header{
                background-color: #BBBBBB;
                height: min-content;
                width: 100%-4px;
                border-radius: 8px;
                display: flex;
                padding: 4px;
                margin-bottom: 32px;
            }
            .top{
                font-size: 64px;
                height: 64px;
                margin: 0px;
                padding: 0px;
                font-weight: 300;
                line-height: 54px;
            }
            .spacer{
                width: 2px;
                height: 64px;
                background-color: gray;
                margin-right: 16px;
                margin-left: 16px;
            }
            a{
                height: 64px;
            }
        </style>
    </head>
    <body>
        <header>
            <img src="favicon.ico" width="64" height="64">
            <h1 class="top">10Geography</h1>
            <div class="spacer"></div>
            <a href="/manage_locations">
                <button style="font-size: 16px; height: 100%;">Go back >>></button>
            </a>
        </header>
        <h1>Choose the correct answer:</h1>
        <img src="mapimage" height="450" width="630">
        <div class="container">
            <form action="/check">
                <input type="radio" name="ch" id="ch1" value="%ch0">
                <label for="c1">%ch0</label><br>
                <input type="radio" name="ch" id="ch2" value="%ch1">
                <label for="c2">%ch1</label><br>
                <input type="radio" name="ch" id="ch3" value="%ch2">
                <label for="c3">%ch2</label><br>
                <input type="radio" name="ch" id="ch4" value="%ch3">
                <label for="c4">%ch3</label><br>
                <input type="submit" value="Send">
            </form>
        </div>
    </body>
</html>
