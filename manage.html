<!DOCTYPE html>
<html>
    <head>
        <title>Modify randomized list</title>
    </head>
    <style>
        .namelabel{
            font-size: 20px;
            padding-left: 4px;
            width: fit-content;
            height: 10px;
            padding-top: 0px;
            margin-top: 0px;
        }
        .addform{
            width: min-content;
            overflow: hidden;
        }
        .container{
            background-color: gainsboro;
            width: max-content;
            border-radius: 10px;
            margin-top: 5px;
            padding: 5px;
            overflow: hidden;
        }
        input[type="text"]{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
        }
        input[type="submit"]{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
            margin-top: 5px;
            float: right;
        }
        .padded{
            margin-bottom: 0px;
        }
        .fillall{
            width: 80%;
        }
        button{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
            margin-top: 5px;
        }
        .right{
            float: right;
        }
        .selector{
            position: relative;
            top: -200px;
            left: -200px;
        }
        .posinput{
            visibility: hidden;
        }
        .slider{
            width: 100%;
        }
    </style>
    <script src="static/jquery.js"></script>
    <script>
        function createps(){
            let add = '';
            let cookies = document.cookie.split('; ');
            for(let i = 0; i < cookies.length; i++){
                add += '<div class="container">';
                add += '<p>' + cookies[i].split('=')[0] + ' @ ' + cookies[i].split('=')[1] + '</p>';
                add += '<a href="/remove?name=' + cookies[i].split('=')[0] + '"><button class="right">Delete</button></a><br>';
                add += '</div>';
            }
            document.body.innerHTML += add;
        }
        function getpos(e) {
            var rect = e.target.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            sel.style.top = String(y-495)+"px";
            sel.style.left = String(x-5)+"px";
            xpos.value = x;
            ypos.value = y;
            z = zoomslider.value/10;
            $.get('/request_image?x='+x+'&y='+y+'&z='+z, function(data, status){
                preview.src = data;
            })
        }
        var lastzoom = 0;
        function changezoom(){
            x = xpos.value;
            y = ypos.value;
            z = zoomslider.value/10;
            if(lastzoom != z){
                $.get('/request_image?x='+x+'&y='+y+'&z='+z, function(data, status){
                    preview.src = data;
                })
                lastzoom = z;
            }
        }
    </script>
    <body onload="createps()">
         <p class="namelabel">Add a new location</p>
        <div class="container">
            <form action="/add_location" class="addform">
                <input type="text" id="name" name="name" class="padded fillall" placeholder="Location name">
                <hr width="90%" size="1" noshade="" color="#AAAAAA">
                <div id="map">
                    <img src="thumbnail-image" onload="document.getElementById('map').onclick = getpos">
                    <img src="static/pin.png" class="selector" id="sel" width="10" height="10">
                </div>
                <input type="number" name="xpos" id="xpos" class="posinput" value="0">
                <input type="number" name="ypos" id="ypos" class="posinput" value="0">
                <input type="range" min="1" max="50" value="10" class="slider" id="zoomslider" onmousemove="changezoom()">
                <input type="submit" value="Add", class="padded">
            </form>
        </div>
        <div class="container">
            <p class="namelabel">Preview:</p><br>
            <img id="preview" src="" width="630" height="450">
        </div>
        <hr noshade color="#AAAAAA" size="1">
        <script>
        </script>
    </body>
</html>
