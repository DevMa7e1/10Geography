<!DOCTYPE html>
<html>
    <head>
        <title>Modify randomized list</title>
    </head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        body{
            font-family: "Lato", sans-serif;
        }
        .namelabel{
            font-size: 20px;
            padding-left: 4px;
            width: fit-content;
            height: 10px;
            padding-top: 0px;
            margin-top: 0px;
        }
        .addform{
            width: min-content;
            overflow: hidden;
        }
        .container{
            background-color: gainsboro;
            width: max-content;
            border-radius: 10px;
            margin-top: 5px;
            padding: 5px;
            overflow: hidden;
            margin-right: 10px;
        }
        input[type="text"]{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
        }
        input[type="submit"]{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
            margin-top: 5px;
            float: right;
        }
        .padded{
            margin-bottom: 0px;
        }
        .fillall{
            width: 80%;
        }
        button{
            border-radius: 10px;
            border-width: 0px;
            padding: 5px;
        }
        .right{
            float: right;
        }
        .selector{
            position: relative;
            top: -350px;
            left: 375px;
            pointer-events: none;
        }
        .posinput{
            visibility: hidden;
        }
        .slider{
            width: 100%;
        }
        .disclaimer{
            font-size: 15px;
            font-weight: 300;
            color: gray;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
        header{
            background-color: #BBBBBB;
            height: min-content;
            width: 100%-4px;
            border-radius: 8px;
            display: flex;
            padding: 4px;
            margin-bottom: 32px;
        }
        h1{
            font-size: 64px;
            height: 64px;
            margin: 0px;
            padding: 0px;
            font-weight: 300;
            line-height: 54px;
        }
        .spacer{
            width: 2px;
            height: 64px;
            background-color: gray;
            margin-right: 16px;
            margin-left: 16px;
        }
    </style>
    <script src="static/jquery.js"></script>
    <script>
        const worldmap = new Image();
        const pin = new Image();
        pin.src = '/static/pin.png'
        $.get('/request_full', function(data, status){
            worldmap.src = data;
        });
        function createps(){
            let add = '';
            let cookies = document.cookie.split('; ');
            if(document.cookie != ''){
                for(let i = 0; i < cookies.length; i++){
                    if(cookies[i].split('=')[0] != 'answer'){
                        add += '<div class="container" style="width: 240px;">';
                        add += '<p>' + cookies[i].split('=')[0] + '</p>';
                        add += '<a href="/remove?name=' + cookies[i].split('=')[0] + '"><button class="right">Delete</button></a><br>';
                        add += '</div>';
                    }
                }
            }
            locations.innerHTML += add;
            worldmap.onload = function(){makepreview(380, 145, 1)};
            lastzoom = 1;
            window.ondragstart = function() {return false}
        }
        function getpos(e) {
            var rect = e.target.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            if(mouseisdown){
                sel.style.top = String(y-495)+"px";
                sel.style.left = String(x-5)+"px";
                xpos.value = x;
                ypos.value = y;
                makepreview(x, y, zoomslider.value/10);
            }
        }
        function get_safe_box(rx1, ry1, rx2, ry2){
            let x1 = rx1;
            let y1 = ry1;
            let x2 = rx2;
            let y2 = ry2;
            const int = Math.round;
            let xadd = 0;
            let yadd = 0;
            if(x1 < 0){
                xadd = 0-x1;
                x1 += xadd;
            }
            if(y1 < 0){
                yadd = 0-y1;
                y1 += yadd;
            }
            x2 += xadd;
            y2 += yadd;
            let xsub = 0;
            let ysub = 0;
            if(x2 > worldmap.width){
                xsub = x2-worldmap.width;
                x2 -= xsub;
            }
            if(y2 > worldmap.height)
                        ysub = y2-worldmap.height;
                        y2 -= ysub;
            x1 -= xsub;
            y1 -= ysub;
            return [[int(x1), int(y1), int(x2), int(y2)], xadd-xsub, yadd-ysub]
        }
        function makepreview(x, y, z){
            const ctx = preview.getContext('2d');
            const c = 5.625;
            z /= 2;
            let p = get_safe_box(Math.round(x * c)-315*z, Math.round(y * c)-225*z, Math.round(x * c)+315*z, Math.round(y * c)+225*z)
            ctx.drawImage(worldmap, p[0][0], p[0][1], 630*z, 450*z, 0, 0, 630, 450);
            ctx.drawImage(pin, 0, 0, 50, 50, Math.round(630/2-10-p[1]/z), Math.round(450/2-10-p[2]/z), 20, 20);
        }
        var lastzoom = 0;
        var mouseisdown = false;
        function mouseisnowdown(){
            mouseisdown = true;
        }
        function mouseisnowup(){
            mouseisdown = false;
        }
        function changezoom(){
            x = xpos.value;
            y = ypos.value;
            z = zoomslider.value/10;
            if(lastzoom != z){
                makepreview(x, y, z)
                lastzoom = z;
            }
        }
    </script>
    <body onload="createps()">
        <header>
            <img src="favicon.ico" width="64" height="64">
            <h1>10Geography</h1>
            <div class="spacer"></div>
            <a style="height: 64px;" href="/select">
                <button style="font-size: 16px; height: 100%;">Go to quiz mode >>></button>
            </a>
        </header>
        <p class="namelabel">Add a new location</p>
        <div style="display: flex;">
            <div class="container">
                <form action="/add_location" class="addform">
                    <input type="text" id="name" name="name" class="padded fillall" placeholder="Location name">
                    <hr width="90%" size="1" noshade="" color="#AAAAAA">
                    <div id="map">
                        <img src="thumbnail-image" onmousedown="mouseisnowdown()"
                        onmouseup="mouseisnowup()" onload="document.getElementById('map').onmousemove = getpos" id="imagemap">
                        <img src="static/pin.png" class="selector" id="sel" width="10" height="10">
                    </div>
                    <input type="number" name="xpos" id="xpos" class="posinput" value="0">
                    <input type="number" name="ypos" id="ypos" class="posinput" value="0">
                    <input type="range" min="5" max="50" value="10" class="slider" id="zoomslider" name="zpos" onmousemove="changezoom()">
                    <input type="submit" value="Add", class="padded">
                </form>
            </div>
            <div class="container">
                <p class="namelabel">Preview:</p><br>
                <canvas id="preview" style="border: 1px solid black;" width="630" height="450"></canvas>
                <p class="disclaimer">*Low resolution preview. For more terrain detail, go to quiz mode.</p>
            </div>
        </div>
        <hr noshade color="#AAAAAA" size="1">
        <div id="locations" class="grid"></div>
    </body>
</html>
